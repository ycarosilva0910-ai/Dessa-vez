name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Montar jogo
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Usar Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "Cython==0.29.34" "setuptools<70" virtualenv wheel

      - name: Gerar APK
        run: buildozer android debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: jogo-apk
          path: bin/*.apk
          if-no-files-found: error
